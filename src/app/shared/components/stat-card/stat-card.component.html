<div class="custom-card stat-card animate-fade-in">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="icon-shape" [ngClass]="'bg-soft-' + badgeColor">
      <i class="bi" [ngClass]="icon"></i>
    </div>
    <span class="badge" [ngClass]="growth >= 0 ? 'badge-soft-success' : 'badge-soft-danger'">
      <i class="bi" [ngClass]="growth >= 0 ? 'bi-arrow-up-short' : 'bi-arrow-down-short'"></i>
      {{ growth >= 0 ? '+' : '' }}{{ growth }}%
    </span>
  </div>

  <div class="stat-body">
    <span class="stat-title">{{ title }}</span>
    <h3 class="stat-value fw-bold mt-1 mb-0">{{ formattedValue }}</h3>
  </div>
</div>
